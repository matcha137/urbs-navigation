<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOKYO発進</title>
<meta name="description" content="散歩のしかたと時間から、東京都江東区の行き先を組み立てます。東京都オープンデータを使っています。">
<meta name="theme-color" content="#cdeef8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- 読み込み中に何も無い画面を出さない -->
<div id="boot" class="boot"><span class="boot-dot"></span>読み込んでいます</div>

<main id="app" hidden>

  <header class="hero">
    <h1 class="hero-title">TOKYO発進</h1>
    <p class="hero-sub" id="hero-sub">今日はどんな散歩がしたい？</p>
    <p class="hero-weather" id="weather"></p>
  </header>

  <!-- ===== 条件を選ぶ (T-53) ===================================== -->
  <section id="ask" class="ask">

    <div class="card">
      <h2 class="card-label"><span aria-hidden="true">📍</span> 出発地点</h2>
      <div class="select-wrap">
        <label class="sr-only" for="station">出発する駅</label>
        <select id="station" class="field"></select>
      </div>
      <p class="card-hint" id="station-hint"></p>
    </div>

    <div class="card">
      <h2 class="card-label"><span aria-hidden="true">⏱</span> 散歩時間を選ぶ</h2>
      <div class="segmented" id="minutes" role="group" aria-label="散歩時間"></div>
    </div>

    <div class="modes" id="modes" role="group" aria-label="散歩のしかた"></div>
  </section>

  <!-- 答えたあとに出る戻り導線 -->
  <div id="answered" class="answered" hidden>
    <button type="button" class="pill" id="change">← 条件を選び直す</button>
    <p class="answered-line" id="answered-line"></p>
  </div>

  <!-- ===== プラン (T-54) ========================================= -->
  <section id="plan" class="plan" hidden aria-live="polite" aria-busy="false">

    <article class="course">
      <div class="course-head">
        <span class="course-emoji" id="plan-emoji" aria-hidden="true"></span>
        <p class="course-kicker" id="plan-headline"></p>
        <h2 class="course-title" id="plan-title"></h2>
      </div>

      <div class="course-body">
        <div class="tiles">
          <div class="tile">
            <p class="tile-label"><span aria-hidden="true">⏱</span> 所要時間</p>
            <p class="tile-value" id="plan-minutes"></p>
          </div>
          <div class="tile">
            <p class="tile-label"><span aria-hidden="true">📍</span> 距離</p>
            <p class="tile-value" id="plan-distance"></p>
          </div>
        </div>

        <div class="point">
          <p class="point-title"><span aria-hidden="true">✨</span> おすすめポイント</p>
          <p class="point-body" id="plan-summary"></p>
        </div>

        <ul class="tags" id="plan-tags"></ul>
        <ol class="stops" id="stops"></ol>
        <p class="plan-footer" id="plan-footer"></p>
      </div>
    </article>

    <button type="button" class="cta" id="another" hidden>
      <span aria-hidden="true">🚀</span> 別の場所を見せて
    </button>

    <!-- 縮退の注記 (T-58) -->
    <div class="notes" id="degraded" hidden></div>
  </section>

  <!-- 候補が無い / 通信できない -->
  <section id="empty" class="card empty" hidden>
    <p id="empty-message"></p>
    <button type="button" class="cta" id="retry">もう一度ためす</button>
  </section>

  <!-- ===== 自然文検索 (T-56) ===================================== -->
  <!-- デモの本線には出さない。開いた人だけが使える保険 -->
  <details class="search" id="search">
    <summary>ことばで探す</summary>
    <form id="search-form" class="search-form">
      <label class="sr-only" for="search-q">探したいこと</label>
      <input id="search-q" name="q" type="search" autocomplete="off"
             class="field" placeholder="雨でも濡れないところ" maxlength="200">
      <button type="submit" class="btn-small">探す</button>
    </form>
    <p class="search-intent" id="search-intent" hidden></p>
    <ul class="search-results" id="search-results"></ul>
  </details>

  <!-- ===== 出典 (T-59) =========================================== -->
  <footer class="sources" id="sources" hidden>
    <h2 class="sources-title">このプランの出典</h2>
    <ul id="sources-list"></ul>
    <p class="sources-note">
      東京都オープンデータカタログサイトのデータを利用しています。
      <span class="sources-caveat">座れる場所は公園の面積からの推定です。段差の情報が無い場所は「不明」と表示しています。</span>
    </p>
  </footer>

</main>

<script src="/app.js" type="module"></script>
</body>
</html>
