<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tokyo Outings</title>
<style>
  :root { --bg:#e6dcc9; --card:#f5ead8; --ink:#201e1d; --accent:#c67139; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--bg); color:var(--ink);
         font-family:Figtree,system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif; }
  .card { background:var(--card); padding:40px 44px; border-radius:28px; max-width:420px;
          box-shadow:0 12px 32px rgba(46,43,37,.18); }
  h1 { font-size:28px; line-height:1.15; margin:0 0 10px; letter-spacing:-.015em; }
  p { margin:0 0 18px; font-size:14.5px; line-height:1.6; color:rgba(32,30,29,.7); }
  code { background:rgba(32,30,29,.08); padding:2px 6px; border-radius:5px; font-size:13px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
         background:var(--accent); margin-right:8px; vertical-align:middle; }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>hello</h1>
    <p>Tokyo Outings の足場が本番に載りました。API の疎通は <code>/api/health</code> で確認できます。</p>
    <p>次: T-04 D1 作成 → T-05 スキーマ適用 → P1 ETL</p>
  </div>
</body>
</html>
